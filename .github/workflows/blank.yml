
name: Update App Config

on:
  workflow_dispatch:
    inputs:
      theme_mode:
        description: "Theme mode: system, light, or dark"
        required: true
        type: choice
        options:
          - system
          - light
          - dark
      show_banner_ads:
        description: "Show banner ads?"
        required: true
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  update-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update config.json
        env:
          THEME_MODE: ${{ inputs.theme_mode }}
          SHOW_BANNER_ADS: ${{ inputs.show_banner_ads }}
        run: |
          python3 - <<'PY'
          import json
          import os

          path = "config.json"

          with open(path, "r", encoding="utf-8") as f:
              config = json.load(f)

          ui = config.setdefault("ui_settings", {})
          ui["theme_mode"] = os.environ["THEME_MODE"]
          ui["show_banner_ads"] = os.environ["SHOW_BANNER_ADS"] == "true"

          with open(path, "w", encoding="utf-8") as f:
              json.dump(config, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Commit config changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update app configuration"
            git push
          fi
