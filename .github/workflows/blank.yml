
name: Update App Config

on:
  workflow_dispatch:
    inputs:
      theme_mode:
        description: "Theme (leave unchanged to keep current)"
        type: choice
        required: true
        default: unchanged
        options:
          - unchanged
          - system
          - light
          - dark

      show_banner_ads:
        description: "Banner ads (leave unchanged to keep current)"
        type: choice
        required: true
        default: unchanged
        options:
          - unchanged
          - "true"
          - "false"

      banner_title:
        description: "Banner title (empty = unchanged)"
        type: string
        required: false
        default: ""

      banner_ad_unit_id:
        description: "AdMob banner unit ID (empty = unchanged)"
        type: string
        required: false
        default: ""

      announcement:
        description: "Announcement message (empty = unchanged)"
        type: string
        required: false
        default: ""

      force_update:
        description: "Force update (leave unchanged to keep current)"
        type: choice
        required: true
        default: unchanged
        options:
          - unchanged
          - "true"
          - "false"

      app_version_code:
        description: "App version code (empty = unchanged)"
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update-config:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate and update config.json
        env:
          THEME_MODE: ${{ inputs.theme_mode }}
          SHOW_BANNER_ADS: ${{ inputs.show_banner_ads }}
          BANNER_TITLE: ${{ inputs.banner_title }}
          BANNER_AD_UNIT_ID: ${{ inputs.banner_ad_unit_id }}
          ANNOUNCEMENT: ${{ inputs.announcement }}
          FORCE_UPDATE: ${{ inputs.force_update }}
          APP_VERSION_CODE: ${{ inputs.app_version_code }}
        run: |
          python3 - <<'PY'
          import json
          import os

          path = "config.json"

          with open(path, "r", encoding="utf-8") as f:
              config = json.load(f)

          if not isinstance(config, dict):
              raise ValueError("config.json must contain a JSON object")

          ui = config.get("ui_settings", {})
          if not isinstance(ui, dict):
              raise ValueError("ui_settings must be a JSON object")

          config["ui_settings"] = ui

          theme = os.environ["THEME_MODE"]
          if theme != "unchanged":
              if theme not in ("system", "light", "dark"):
                  raise ValueError("Invalid theme_mode")
              ui["theme_mode"] = theme

          ads = os.environ["SHOW_BANNER_ADS"]
          if ads != "unchanged":
              if ads not in ("true", "false"):
                  raise ValueError("Invalid show_banner_ads")
              ui["show_banner_ads"] = (ads == "true")

          title = os.environ["BANNER_TITLE"]
          if title != "":
              ui["banner_title"] = title

          ad_id = os.environ["BANNER_AD_UNIT_ID"]
          if ad_id != "":
              if not ad_id.startswith("ca-app-pub-"):
                  raise ValueError("Invalid AdMob banner unit ID")
              ui["banner_ad_unit_id"] = ad_id

          announcement = os.environ["ANNOUNCEMENT"]
          if announcement != "":
              config["announcement"] = announcement

          force = os.environ["FORCE_UPDATE"]
          if force != "unchanged":
              if force not in ("true", "false"):
                  raise ValueError("Invalid force_update")
              config["force_update"] = (force == "true")

          version = os.environ["APP_VERSION_CODE"]
          if version != "":
              try:
                  parsed_version = int(version)
              except ValueError:
                  raise ValueError("app_version_code must be an integer")
              if parsed_version < 0:
                  raise ValueError("app_version_code cannot be negative")
              config["app_version_code"] = parsed_version

          with open(path, "w", encoding="utf-8") as f:
              json.dump(config, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print("config.json validated and updated.")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.json
          if git diff --cached --quiet; then
            echo "No changes requested; config.json remains unchanged."
          else
            git commit -m "Update remote app configuration"
            git push
          fi
